name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build -- --base-href=/sanabel/

      - name: Deploy to gh-pages
        run: npx gh-pages -d dist/sanabel-quranic-complex --repo https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git --branch gh-pages
