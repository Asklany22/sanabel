name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        # For GitHub Pages project sites we set base-href to /<repo>/ so assets load correctly.
        run: npm run build --if-present -- --configuration production --base-href=/${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist/sanabel-quranic-complex

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
